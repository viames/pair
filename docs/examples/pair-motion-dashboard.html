<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Try PairMotion on a sample operations dashboard with a rolling KPI, goal meter and animated delivery chart.">
	<title>Operations dashboard · PairMotion</title>
	<link rel="stylesheet" href="../../assets/pair-motion.css">
	<script src="../../assets/PairMotion.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" defer></script>
	<script src="pair-motion-dashboard.js" defer></script>
	<style>
		:root { color-scheme: light dark; font: 1rem/1.5 system-ui, sans-serif; --ink: light-dark(#17293a, #eaf2f8); --muted: light-dark(#465c71, #b0c1ce); --card: light-dark(#fff, #1d2d3b); --bg: light-dark(#edf2f6, #121d28); --accent: light-dark(#116d63, #67d9c6); --line: light-dark(#d5dfe6, #354a5b); }
		body { background: var(--bg); color: var(--ink); margin: 0; }
		main { max-inline-size: 64rem; margin-inline: auto; padding: clamp(1rem, 4vw, 3rem); --pair-motion-progress-fill: var(--accent); }
		nav { display: flex; flex-wrap: wrap; gap: .5rem 1rem; font-size: .9rem; }
		a { color: var(--accent); text-underline-offset: .2em; }
		h1 { margin: .65rem 0 .25rem; font-size: clamp(1.75rem, 4vw, 2.65rem); line-height: 1.15; letter-spacing: -.035em; }
		h2 { margin: 0 0 .45rem; font-size: 1.125rem; }
		p { margin: .4rem 0 .8rem; }
		.muted { color: var(--muted); }
		.toolbar, .cards { display: flex; flex-wrap: wrap; gap: .65rem; }
		.toolbar { align-items: end; margin-block: 1.25rem; }
		button, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: .45rem; min-block-size: 2.75rem; padding-inline: .8rem; }
		button { cursor: pointer; }
		button:hover { border-color: var(--accent); }
		:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
		.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); margin-block-end: .75rem; }
		.card { background: var(--card); border: 1px solid var(--line); border-radius: .75rem; padding: 1.1rem; min-inline-size: 0; }
		.kpi { font-size: clamp(1.8rem, 4vw, 2.65rem); font-weight: 720; margin-block: .1rem .5rem; }
		.kpi small { font-size: .95rem; font-weight: 500; color: var(--muted); }
		.plot { position: relative; block-size: clamp(12rem, 31vw, 20rem); margin-block: .65rem; }
		details { margin-block-start: .65rem; }
		summary { cursor: pointer; }
		table { border-collapse: collapse; inline-size: 100%; }
		td, th { text-align: start; border-block-end: 1px solid var(--line); padding: .3rem .6rem; }
		.toolbar[hidden], .plot[hidden] { display: none; }
	</style>
</head>
<body>
	<main id="dashboard" data-pair-motion-page>
		<nav aria-label="PairMotion">
			<a href="pair-motion.html">Component examples</a>
			<a href="https://github.com/viames/pair/wiki/PairMotion.js">API guide</a>
			<a href="https://github.com/viames/pair/tree/main/docs/examples">Source on GitHub</a>
		</nav>
		<h1 data-pair-motion-enter="0">Delivery operations</h1>
		<p class="muted">Sample data · Orders fulfilled, targets and daily deliveries</p>
		<div class="toolbar" hidden>
			<label>Period <select id="period"><option value="oct">October</option><option value="nov">November</option></select></label>
			<button id="refresh" type="button">Refresh data</button>
			<button id="replay" type="button">Replay entrance</button>
		</div>
		<div class="cards">
			<section class="card" data-pair-motion-enter="1">
				<h2>Orders fulfilled</h2>
				<p class="kpi"><span id="orders" data-pair-motion-counter><span data-pair-motion-value>51</span></span> <small>of 100</small></p>
				<div id="target" data-pair-motion-progress><progress max="100" value="51" aria-label="Fulfilment target">51%</progress></div>
			</section>
			<section class="card" data-pair-motion-enter="1">
				<h2>Awaiting pickup</h2>
				<p class="kpi"><span id="pickup" data-pair-motion-counter><span data-pair-motion-value>12</span></span></p>
				<div data-pair-motion-region>
					<p class="muted" id="queue-note" data-pair-motion-content>Next pickup Friday afternoon.</p>
				</div>
			</section>
		</div>
		<section class="card" data-pair-motion-enter="2">
			<h2>Daily deliveries</h2>
			<div class="plot" hidden><canvas id="deliveries" role="img" aria-label="Daily deliveries. Values are in the data table."></canvas></div>
			<details data-pair-motion-disclosure>
				<summary>Delivery data</summary>
				<div data-pair-motion-disclosure-body>
					<table>
						<thead><tr><th scope="col">Day</th><th scope="col">Orders</th></tr></thead>
						<tbody id="delivery-data"><tr><th scope="row">Mon</th><td>8</td></tr><tr><th scope="row">Tue</th><td>11</td></tr><tr><th scope="row">Wed</th><td>9</td></tr><tr><th scope="row">Thu</th><td>13</td></tr><tr><th scope="row">Fri</th><td>10</td></tr></tbody>
					</table>
				</div>
			</details>
		</section>
	</main>
</body>
</html>
